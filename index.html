    const label = (fromName && toName) ? ('Walk: ' + fromName + ' → ' + toName)
                : fromName ? ('Walk from ' + fromName)
                : toName ? ('Walk to ' + toName)
                : 'Path ' + (draftPaths.length + 1);

    draftPaths.push({
      id: drawing.id,
      name: label,
      date: day,
      fromName: fromName,
      toName: toName,
      points: drawing.points.slice(),
      anchors: drawing.anchors.slice(),
      auto: autoRoute
    });
    savePaths();
    drawing = null;
    el.stage.classList.remove('drawing');
    renderPaths();
    renderTlFoot();
    toast(editSecret ? 'Path drawn. Save to push it to Notion.'
                     : 'Path drawn and kept in this browser.');
  }

  // OSRM returns GeoJSON [lng,lat]; Leaflet wants [lat,lng]. AbortController
  // keeps a hung request from leaving the tool stuck in "routing…".
  async function routeSegment(a, b) {
    const url = OSRM + a[1] + ',' + a[0] + ';' + b[1] + ',' + b[0] +
                '?overview=full&geometries=geojson';
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(function () { ctrl && ctrl.abort(); }, OSRM_TIMEOUT_MS);
    try {
      const res = await fetch(url, ctrl ? { signal: ctrl.signal } : undefined);
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const coords = json && json.routes && json.routes[0] &&
                     json.routes[0].geometry && json.routes[0].geometry.coordinates;
      if (!coords || !coords.length) throw new Error('no route');
      return coords.map(function (c) { return [c[1], c[0]]; });
    } catch (e) {
      clearTimeout(timer);
      toast('Auto-routing unavailable — straight line used.');
      return null;
    }
  }

  function savePaths() {
    lsSet(LS_PATHS, draftPaths.map(function (p) {
      return { id: p.id, name: p.name, date: p.date, points: p.points,
               anchors: p.anchors, auto: p.auto,
               fromName: p.fromName || null, toName: p.toName || null,
               notionId: p.notionId || null, pendingEdit: !!p.pendingEdit };
    }));
  }

  async function deletePath(id) {
    const p = draftPaths.find(function (x) { return x.id === id; });
    const notionId = p && p.notionId;

    draftPaths = draftPaths.filter(function (x) { return x.id !== id; });
    if (editingPathId === id) editingPathId = null;
    savePaths();
    renderPaths();
    renderTlFoot();

    // A path that reached Notion has to be archived there too, or it comes
    // straight back on the next reload.
    if (notionId && editSecret) {
      try {
        const res = await fetch(SAVE_API, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: editSecret, deletePathIds: [notionId] })
        });
        const j = await res.json();
        toast(j && j.ok ? 'Path removed, and archived in Notion.'
                        : 'Removed here, but Notion said no — it will return on reload.');
      } catch (e) {
        toast('Removed here, but Notion could not be reached — it will return on reload.');
      }
      refreshAll();
    } else if (notionId) {
      toast('Removed here. It is still in Notion — set the passphrase to archive it.');
    }
  }

  function pathCoordString(p) {
    return p.points.map(function (pt) {
      return pt[0].toFixed(5) + ',' + pt[1].toFixed(5);
    }).join('; ');
  }

  function toggleEditPath(id) {
    editingPathId = editingPathId === id ? null : id;
    renderPaths();
    if (editingPathId) toast('Drag a vertex to move it. Click one to delete it.');
  }

  // Draft paths render into their own layer so a day change, a zoom-driven
  // recluster or a redraw of the day never wipes them.
  function renderPaths() {
    if (!pathLayer) return;
    pathLayer.clearLayers();

    const live = drawing
      ? [{ id: drawing.id, name: 'drawing', points: drawing.points, anchors: drawing.anchors, live: true }]
      : [];

    live.concat(draftPaths).forEach(function (p) {
      if (!p.points || p.points.length < 1) return;
      if (p.points.length > 1) {
        L.polyline(p.points, {
          pane: 'legCase', color: '#060b0f', weight: 8.5, opacity: 0.85, interactive: false
        }).addTo(pathLayer);
        L.polyline(p.points, {
          pane: 'legs', color: p.live ? '#7fd4ff' : '#9ad9f5', weight: 4,
          opacity: 1, dashArray: p.live ? '6 5' : null,
          interactive: !p.live
        }).on('click', function () { if (!p.live) toggleEditPath(p.id); })
          .bindTooltip(p.live ? 'Drawing…' : p.name, { className: 'tip', sticky: true })
          .addTo(pathLayer);
      }

      // Anchors are shown while drawing, and while a saved path is being edited.
      const showVerts = p.live || p.id === editingPathId;
      if (!showVerts) return;
      (p.anchors || p.points).forEach(function (pt, idx) {
        const m = L.marker(pt, {
          icon: L.divIcon({ className: '', iconSize: [13, 13], iconAnchor: [6.5, 6.5],
                            html: '<div class="vertex"></div>' }),
          draggable: !p.live, zIndexOffset: 700
        });
        if (!p.live) {
          m.on('dragend', function (e) {
            const ll = e.target.getLatLng();
            moveVertex(p.id, idx, [ll.lat, ll.lng]);
          });
          m.on('click', function () { removeVertex(p.id, idx); });
        }
        m.addTo(pathLayer);
      });
    });

    renderPathList();
    if (el.tlFoot) renderTlFoot();
  }

  function markDirty(p) {
    // An edited path is out of step with its Notion row until saved again.
    if (p.notionId) { p.pendingEdit = true; }
  }

  function moveVertex(pathId, idx, latlng) {
    const p = draftPaths.find(function (x) { return x.id === pathId; });
    if (!p) return;
    markDirty(p);
    const anchors = (p.anchors || p.points).slice();
    anchors[idx] = latlng;
    p.anchors = anchors;
    p.points = anchors.slice();
    savePaths();
    renderPaths();
    if (p.auto && anchors.length > 1) { editingPathId = p.id; rebuildRouted(anchors); }
  }

  function removeVertex(pathId, idx) {
    const p = draftPaths.find(function (x) { return x.id === pathId; });
    if (!p) return;
    markDirty(p);
    const anchors = (p.anchors || p.points).slice();
    if (anchors.length <= 2) { toast('A path needs at least two points.'); return; }
    anchors.splice(idx, 1);
    p.anchors = anchors;
    p.points = anchors.slice();
    savePaths();
    renderPaths();
    if (p.auto) { editingPathId = p.id; rebuildRouted(anchors); }
  }

  function renderPathList() {
    const box = $('pathList');
    if (!box) return;
    if (!draftPaths.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="paths">' + draftPaths.map(function (p) {
      const mi = p.points.length > 1 ? routeMiles(p.points) + ' mi' : '';
      const synced = !!p.notionId;
      return '<div class="paths__row">' +
        '<span class="paths__sw"' + (synced ? ' style="background:var(--t-attr)"' : '') +
          ' title="' + (synced ? 'In Notion' : 'Not saved yet') + '"></span>' +
        '<button class="paths__nm" data-path-edit="' + esc(p.id) + '" title="Edit vertices">' +
          esc(p.name) + '<span class="paths__mi">' + esc(mi) +
          (synced ? ' · in Notion' : '') +
          (p.id === editingPathId ? ' · editing' : '') + '</span></button>' +
        '<button class="btn btn--ghost" data-path-copy="' + esc(p.id) + '" ' +
          'title="Copy as a Route value for Notion">Copy</button>' +
        '<button class="paths__x" data-path-del="' + esc(p.id) + '" aria-label="Delete path">&times;</button>' +
        '</div>';
    }).join('') + '</div>';
  }

  /* ── DAY RAIL ──────────────────────────────────────────────────────────── */

  function dayHasUnbooked(date) {
    return itemsOn(date).some(function (i) { return i.booked === false; });
  }

  function renderRail() {
    const parts = ['<button class="day day--all" data-date="all" aria-pressed="' +
      (selectedDate === 'all') + '"><span class="day__n">WHOLE</span>' +
      '<span class="day__date">Trip</span></button>'];

    model.days.forEach(function (d) {
      parts.push(
        '<button class="day" data-date="' + d.date + '" aria-pressed="' + (selectedDate === d.date) + '">' +
          '<span class="day__n">DAY ' + d.n + (dayHasUnbooked(d.date) ? '<span class="day__mark"></span>' : '') + '</span>' +
          '<span class="day__date">' + esc(fmtDate(d.date)) + '</span>' +
          '<span class="day__sleep">' + esc(d.sleeping || d.base || '') + '</span>' +
        '</button>');
    });
    el.railTrack.innerHTML = parts.join('');

    const i = currentIndex();
    el.railPrev.disabled = i <= 0;
    el.railNext.disabled = i >= model.days.length - 1;

    // Do NOT use scrollIntoView here: it scrolls every scrollable ancestor,
    // including the document, which drags the whole page sideways once the
    // selected day is near the end of the rail. Move only the rail.
    const active = el.railTrack.querySelector('[aria-pressed="true"]');
    if (active) {
      const left = active.offsetLeft - (el.railTrack.clientWidth - active.offsetWidth) / 2;
      const max = el.railTrack.scrollWidth - el.railTrack.clientWidth;
      el.railTrack.scrollLeft = Math.max(0, Math.min(max, left));
    }
  }

  function currentIndex() {
    if (selectedDate === 'all') return -1;
    return model.days.findIndex(function (d) { return d.date === selectedDate; });
  }

  function refreshAll() {
    renderRail();
    renderMap(false);
    renderList();
    renderTimeline();
    renderPaths();
    if (activeId) renderDetail();
  }

  function setDay(date) {
    selectedDate = date;
    activeId = null;
    stackIds = null;
    el.detail.classList.remove('is-open');
    renderRail();
    renderMap(true);
    renderTimeline();
    if (view === 'list') scrollListToDay(date);
  }

  function stepDay(delta) {
    const i = currentIndex();
    const next = i === -1 ? 0 : i + delta;
    if (next < 0 || next >= model.days.length) return;
    setDay(model.days[next].date);
  }

  /* ── LIST VIEW ─────────────────────────────────────────────────────────── */

  function renderList() {
    const blocks = model.days.map(function (d) {
      const list = sortByTime(itemsOn(d.date));
      const rows = list.length ? list.map(function (i) {
        const sub = [i.subtitle, i.kind === 'stay' ? 'overnight' : null]
                      .filter(Boolean).join(' · ');
        return '<li><button class="item" data-id="' + esc(i.id) + '">' +
            '<span class="item__time">' + esc(i.time && !i.timeIsDefault ? i.time : '') + '</span>' +
            '<span class="item__mark' + (i.booked === false ? ' is-unbooked' : '') +
              '" style="--c:' + itemColor(i) + '"></span>' +
            '<span><span class="item__title">' + esc(i.title) + '</span>' +
              (sub ? '<br><span class="item__sub">' + esc(sub) + '</span>' : '') +
            '</span></button></li>';
      }).join('') : '<li class="empty">Nothing on this day yet.</li>';

      return '<article class="dayblock" id="d-' + d.date + '">' +
        '<header class="dayblock__head">' +
          '<span class="dayblock__n">DAY ' + d.n + '</span>' +
          '<span class="dayblock__date">' + esc(fmtDate(d.date)) + '</span>' +
          (d.sleeping ? '<span class="dayblock__sleep">Sleeping: ' + esc(d.sleeping) + '</span>' : '') +
          (d.summary ? '<span class="dayblock__sleep">' + esc(d.summary) + '</span>' : '') +
        '</header>' +
        '<ul class="items">' + rows + '</ul></article>';
    }).join('');

    const nUnbooked = model.items.filter(function (i) { return i.booked === false; }).length;
    const intro = '<p class="list__intro">' + model.items.length + ' entries, ' +
      nUnbooked + ' still to book. Pick anything to see it on the map.</p>';

    el.list.innerHTML = intro + blocks;
  }

  function scrollListToDay(date) {
    if (date === 'all') { el.list.scrollTop = 0; return; }
    const target = $('d-' + date);
    if (target) el.list.scrollTop = target.offsetTop - 4;
  }

  /* ── VIEW SWITCH ───────────────────────────────────────────────────────── */

  function setView(v) {
    view = v;
    const isMap = v === 'map';
    el.tabMap.setAttribute('aria-selected', String(isMap));
    el.tabList.setAttribute('aria-selected', String(!isMap));
    el.map.classList.toggle('is-hidden', !isMap);
    el.list.classList.toggle('is-visible', !isMap);
    el.legend.classList.toggle('is-off', !isMap);
    if (isMap && map) { map.invalidateSize(); }
    else { scrollListToDay(selectedDate); }
  }

  /* ── CHROME ────────────────────────────────────────────────────────────── */

  function renderChrome() {
    el.tripName.textContent = model.trip.name || 'Trip';
    el.tripDates.textContent = fmtDate(model.trip.startDate) + ' – ' + fmtDate(model.trip.endDate);
    document.title = (model.trip.name || 'Trip') + ' — Trip Planner';

    const n = model.items.filter(function (i) { return i.booked === false; }).length;
    el.unbookedFlag.hidden = n === 0;
    el.unbookedFlag.textContent = n + (n === 1 ? ' thing to book' : ' things to book');

    renderLegendKey();

    el.legendModes.innerHTML = LEGEND_MODES.map(function (m) {
      const s = MODES[m];
      return '<svg width="42" height="8" aria-hidden="true"><line x1="1" y1="4" x2="41" y2="4" ' +
             'stroke="#9fb3c0" stroke-width="' + s.weight + '" stroke-linecap="' + s.cap +
             '" stroke-dasharray="' + s.dash + '"/></svg><span>' + s.label + '</span>';
    }).join('');
  }

  function renderLegendKey() {
    if (colourMode === 'type') {
      el.legendKey.innerHTML =
        '<div class="legend__types">' +
        TYPE_ORDER.map(function (k) {
          return '<i style="background:' + TYPE_COLOR[k] + '"></i><span>' +
                 esc(TYPE_LABEL[k]) + '</span>';
        }).join('') +
        '</div><div class="legend__note">Travel legs stay coloured by time of ' +
        'day; a walking route drawn on a place takes that place\'s colour.</div>';
    } else {
      el.legendKey.innerHTML =
        '<div>Colour is time of day</div>' +
        '<div class="legend__ramp"></div>' +
        '<div class="legend__scale"><span>00</span><span>06</span><span>12</span>' +
        '<span>18</span><span>24</span></div>';
    }
    el.modeType.setAttribute('aria-pressed', String(colourMode === 'type'));
    el.modeTime.setAttribute('aria-pressed', String(colourMode === 'time'));
  }

  function setColourMode(mode) {
    if (mode === colourMode) return;
    colourMode = mode;
    renderLegendKey();
    renderMap(false);
    renderList();
    if (activeId) renderDetail();
  }

  /* ── EVENTS ────────────────────────────────────────────────────────────── */

  function wire() {
    el.railTrack.addEventListener('click', function (e) {
      const b = e.target.closest('[data-date]');
      if (b) setDay(b.dataset.date);
    });
    el.railPrev.addEventListener('click', function () { stepDay(-1); });
    el.railNext.addEventListener('click', function () { stepDay(1); });

    el.tabMap.addEventListener('click', function () { setView('map'); });
    el.tabList.addEventListener('click', function () { setView('list'); });

    el.list.addEventListener('click', function (e) {
      const b = e.target.closest('[data-id]');
      if (!b) return;
      setView('map');
      const i = model.byId[b.dataset.id];
      if (i && i.dates[0]) { selectedDate = i.dates[0]; renderRail(); renderMap(true); }
      select(b.dataset.id);
    });

    el.detailBody.addEventListener('click', function (e) {
      const b = e.target.closest('[data-id]');
      if (b) select(b.dataset.id);
    });

    el.detailClose.addEventListener('click', function () {
      activeId = null;
      stackIds = null;
      el.detail.classList.remove('is-open');
      renderMap(false);
    });

    el.modeType.addEventListener('click', function () { setColourMode('type'); });
    el.modeTime.addEventListener('click', function () { setColourMode('time'); });

    el.legendToggle.addEventListener('click', function () {
      const c = el.legend.classList.toggle('is-collapsed');
      el.legendToggle.innerHTML = c ? '+' : '&minus;';
    });

    /* ── Timeline: open the editor, nudge, set, reset, select ──────────── */
    el.tlBody.addEventListener('click', function (e) {
      const t = e.target.closest('[data-tedit]');
      if (t) {
        editingTimeFor = editingTimeFor === t.dataset.tedit ? null : t.dataset.tedit;
        renderTimeline();
        const input = el.tlBody.querySelector('[data-tset]');
        if (input) input.focus();
        return;
      }
      const n = e.target.closest('[data-nudge]');
      if (n) {
        const parts = n.dataset.nudge.split('|');
        nudgeTime(parts[0], parseInt(parts[1], 10));
        return;
      }
      const r = e.target.closest('[data-treset]');
      if (r) { setTimeOverride(r.dataset.treset, null); return; }

      const o = e.target.closest('[data-ev-open]');
      if (o) { select(o.dataset.evOpen); return; }
    });

    // 'change' rather than 'input': a partly-typed time would otherwise land as
    // a real value on every keystroke.
    el.tlBody.addEventListener('change', function (e) {
      const set = e.target.closest('[data-tset]');
      if (set) setTimeOverride(set.dataset.tset, set.value || null);
    });

    el.tlFoot.addEventListener('click', function (e) {
      if (e.target.closest('#btnSave')) { saveToNotion(); return; }
      if (e.target.closest('#btnSecret')) { promptSecret(); return; }
      if (e.target.closest('#btnCopyTimes')) { copyTimeChanges(); return; }
      if (e.target.closest('#btnClearTimes')) {
        timeOverrides = {};
        lsSet(LS_TIMES, timeOverrides);
        refreshAll();
        toast('Times back to what Notion says.');
      }
    });

    /* ── Path tool ─────────────────────────────────────────────────────── */
    el.btnPath.addEventListener('click', function () {
      if (drawing) endDraw(); else startDraw();
    });
    el.btnAuto.addEventListener('click', function () {
      autoRoute = !autoRoute;
      el.btnAuto.setAttribute('aria-pressed', String(autoRoute));
      el.btnAuto.classList.toggle('btn--on', autoRoute);
      toast(autoRoute
        ? 'Auto: new segments follow streets where the router can.'
        : 'Manual: segments join your points directly.');
    });
    el.btnEndPath.addEventListener('click', endDraw);
    el.btnCancelPath.addEventListener('click', cancelDraw);
    el.btnUndoPt.addEventListener('click', undoPoint);

    const pathBox = $('pathList');
    pathBox.addEventListener('click', function (e) {
      const ed = e.target.closest('[data-path-edit]');
      if (ed) { toggleEditPath(ed.dataset.pathEdit); return; }
      const cp = e.target.closest('[data-path-copy]');
      if (cp) {
        const p = draftPaths.find(function (x) { return x.id === cp.dataset.pathCopy; });
        if (p) copyText(pathCoordString(p),
          'Route copied — paste into a Place\'s Route column in Notion.');
        return;
      }
      const dl = e.target.closest('[data-path-del]');
      if (dl) deletePath(dl.dataset.pathDel);
    });

    /* ── Timeline visibility ───────────────────────────────────────────── */
    el.btnTl.addEventListener('click', function () {
      tlOpen = !tlOpen;
      el.stage.classList.toggle('no-tl', !tlOpen);
      el.stage.classList.toggle('tl-open', tlOpen);
      el.btnTl.classList.toggle('btn--on', tlOpen);
      if (map) setTimeout(function () { map.invalidateSize(); }, 220);
    });

    document.addEventListener('keydown', function (e) {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (drawing) {
        // While drawing, the arrow keys would change the day out from under the
        // path, so only Enter and Escape are live.
        if (e.key === 'Enter') { e.preventDefault(); endDraw(); }
        else if (e.key === 'Escape') { cancelDraw(); }
        return;
      }
      if (e.key === 'ArrowLeft') { stepDay(-1); }
      else if (e.key === 'ArrowRight') { stepDay(1); }
      else if (e.key === 'Escape') {
        activeId = null; stackIds = null;
        el.detail.classList.remove('is-open'); renderMap(false);
      }
    });
  }

  function cacheDom() {
    ['tripName', 'tripDates', 'unbookedFlag', 'tabMap', 'tabList', 'railTrack',
     'railPrev', 'railNext', 'map', 'list', 'detail', 'detailBody', 'detailClose',
     'legend', 'legendToggle', 'legendModes', 'legendKey',
     'modeType', 'modeTime',
     'stage', 'tools', 'btnPath', 'btnAuto', 'btnTl', 'drawBar', 'drawHint',
     'drawCount', 'btnUndoPt', 'btnEndPath', 'btnCancelPath',
     'timeline', 'tlTitle', 'tlSub', 'tlBody', 'tlFoot', 'toast',
     'pathList'].forEach(function (k) { el[k] = $(k); });
  }

  /* ── BOOT ──────────────────────────────────────────────────────────────── */

  async function boot() {
    cacheDom();
    try {
      const raw = await loadRaw();
      model = buildModel(raw);
    } catch (err) {
      bootError = err;
      el.list.innerHTML = '<p class="list__intro">Could not load the trip data.<br>' +
        esc(err && err.message ? err.message : String(err)) +
        '<br><br>If the Netlify function is live, open its URL directly in a tab — ' +
        'a stale deploy and a data problem look identical from here.</p>';
      el.list.classList.add('is-visible');
      el.map.style.display = 'none';
      return;
    }
    // Local edits before the first render, so a reload comes back exactly as
    // it was left. Stored values are this browser's own, but they are still
    // parsed defensively: a hand-edited or half-written localStorage entry
    // should degrade, not throw.
    const storedTimes = lsGet(LS_TIMES, {});
    if (storedTimes && typeof storedTimes === 'object' && !Array.isArray(storedTimes)) {
      Object.keys(storedTimes).forEach(function (k) {
        if (typeof storedTimes[k] === 'string' && /^\d{1,2}:\d{2}$/.test(storedTimes[k])) {
          timeOverrides[k] = storedTimes[k];
        }
      });
    }
    const storedSecret = lsGet(LS_SECRET, '');
    if (typeof storedSecret === 'string') editSecret = storedSecret;

    const storedPaths = lsGet(LS_PATHS, []);
    if (Array.isArray(storedPaths)) {
      draftPaths = storedPaths.filter(function (p) {
        return p && typeof p.id === 'string' && Array.isArray(p.points) &&
               p.points.length > 1 &&
               p.points.every(function (pt) {
                 return Array.isArray(pt) && pt.length === 2 &&
                        isFinite(pt[0]) && isFinite(pt[1]) &&
                        Math.abs(pt[0]) <= 90 && Math.abs(pt[1]) <= 180;
               });
      });
    }

    renderChrome();
    initMap();
    renderRail();
    renderList();
    renderMap(true);
    renderTimeline();
    renderPaths();
    wire();
    // Below the breakpoint the rail covers the map rather than sitting beside
    // it, so start it closed there and let the toolbar button bring it in.
    tlOpen = window.innerWidth > 980;
    el.stage.classList.toggle('tl-open', tlOpen);
    el.stage.classList.toggle('no-tl', !tlOpen);
    el.btnTl.classList.toggle('btn--on', tlOpen);
    setDay(model.days.length ? model.days[0].date : 'all');
    setView('map');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
