<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ──────────────────────────────────────────────────────────────────────────
   Tokens
   ────────────────────────────────────────────────────────────────────────── */
:root{
  --ink:#141d25;          /* page base — cool slate, not tinted black */
  --panel:#1b2831;
  --panel-2:#22323d;
  --rule:#30444f;
  --paper:#e7edf1;
  --muted:#8fa3b0;
  --muted-2:#6c8191;
  --warn:#f2d08a;         /* unbooked — monochrome warm, stays out of the time ramp */
  /* Type colours. Coral/teal/slate: a red-blue pair is among the safer ones
     for colour-blind viewers, and none of the three is the amber that means
     "unbooked". */
  --t-food:#f2795f;
  --t-attr:#5ec8c4;
  --t-other:#8a99a6;
  --focus:#7fd4ff;
  --rail-h:76px;
  --tl-w:316px;          /* timeline rail width */
  --bar-h:52px;
  --font:"Barlow","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-c:"Barlow Condensed","Barlow","Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  margin:0; background:var(--ink); color:var(--paper);
  font-family:var(--font); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--focus);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ──────────────────────────────────────────────────────────────────────────
   Top bar
   ────────────────────────────────────────────────────────────────────────── */
.bar{
  height:var(--bar-h); display:flex; align-items:center; gap:16px;
  padding:0 14px; border-bottom:1px solid var(--rule); background:var(--panel);
  position:relative; z-index:800;
}
.bar__title{font-family:var(--font-c);font-size:22px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.bar__dates{color:var(--muted);font-family:var(--font-c);font-size:17px;white-space:nowrap}
.bar__spacer{flex:1}
.bar__flag{
  display:flex;align-items:center;gap:7px;color:var(--warn);
  font-size:13px;white-space:nowrap;
}
.bar__flag::before{
  content:"";width:9px;height:9px;border-radius:50%;
  border:1.5px dashed var(--warn);
}
.tabs{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.tabs button{padding:5px 15px;color:var(--muted);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--paper)}

/* ──────────────────────────────────────────────────────────────────────────
   Day rail — the departure-board strip. One cell per day; the label under
   each number is where you sleep that night.
   ────────────────────────────────────────────────────────────────────────── */
.rail{
  height:var(--rail-h); display:flex; align-items:stretch;
  border-bottom:1px solid var(--rule); background:var(--panel);
  position:relative; z-index:700;
}
.rail__nav{width:34px;flex:none;color:var(--muted);font-size:17px}
.rail__nav:hover{color:var(--paper);background:var(--panel-2)}
.rail__nav:disabled{opacity:.25;cursor:default;background:none}
.rail__track{
  flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;
  scroll-snap-type:x proximity;
  position:relative;   /* so day.offsetLeft is measured against the track */
}
.rail__track::-webkit-scrollbar{height:4px}
.rail__track::-webkit-scrollbar-thumb{background:var(--rule)}
.day{
  flex:0 0 auto; min-width:92px; scroll-snap-align:center;
  display:flex;flex-direction:column;justify-content:center;gap:1px;
  padding:6px 12px; text-align:left;
  border-right:1px solid var(--rule); border-bottom:3px solid transparent;
  color:var(--muted);
}
.day:hover{background:var(--panel-2)}
.day[aria-pressed="true"]{background:var(--panel-2);color:var(--paper);border-bottom-color:var(--paper)}
.day--all{min-width:64px;border-right:1px solid var(--rule)}
.day__n{font-family:var(--font-c);font-size:13px;letter-spacing:.06em;color:var(--muted-2)}
.day[aria-pressed="true"] .day__n{color:var(--muted)}
.day__date{font-family:var(--font-c);font-size:19px;font-weight:600;line-height:1.1}
.day__sleep{
  font-size:11.5px;line-height:1.25;color:var(--muted-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;
}
.day[aria-pressed="true"] .day__sleep{color:var(--muted)}
.day__mark{
  width:6px;height:6px;border-radius:50%;border:1px dashed var(--warn);
  display:inline-block;vertical-align:middle;margin-left:5px;
}

/* ──────────────────────────────────────────────────────────────────────────
   Stage
   ────────────────────────────────────────────────────────────────────────── */
.stage{position:absolute;inset:calc(var(--bar-h) + var(--rail-h) + env(safe-area-inset-top,0px)) 0 env(safe-area-inset-bottom,0px) 0}
#map{position:absolute;top:0;bottom:0;left:0;right:var(--tl-w);background:#0e161c}
.stage.no-tl #map{right:0}
#map.is-hidden{visibility:hidden}
.leaflet-container{background:#0e161c;font-family:var(--font)}
/* Dark basemap without a tile-provider account. Scoped to the tile pane so it
   never touches markers, paths or controls. */
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.72) contrast(.78) saturate(.45)}
.leaflet-control-attribution{background:rgba(20,29,37,.8)!important;color:var(--muted-2)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
/* Leaflet's zoom control also lives top-left, where it sat on top of the path
   toolbar. Push the whole control stack below it. */
.leaflet-top.leaflet-left{margin-top:46px}
.leaflet-bar a{background:var(--panel);color:var(--paper);border-color:var(--rule)}
.leaflet-bar a:hover{background:var(--panel-2);color:var(--paper)}

/* ── Map nodes ─────────────────────────────────────────────────────────── */
.node{position:relative;width:22px;height:22px}
.node__dot{
  position:absolute;inset:4px;background:var(--c,#888);
  border:2px solid #fff;
  /* Dark ring outside the white one: together they guarantee contrast on any
     basemap colour, which a glow alone does not. */
  box-shadow:0 0 0 1.5px rgba(6,11,15,.9), 0 1px 7px 0 rgba(0,0,0,.65),
             0 0 11px -2px var(--c,#888);
}
.node--place .node__dot,.node--food .node__dot{border-radius:50%}
.node--stay .node__dot{border-radius:2px}
.node--hub .node__dot{border-radius:2px;transform:rotate(45deg);inset:3px}
.node--waypoint .node__dot{inset:6px;border-radius:50%;border-width:1.5px}
.node__ring{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px dashed var(--warn);opacity:0;
}
.node.is-unbooked .node__ring{opacity:1;animation:pulse 2.4s ease-out infinite}
.node.is-active .node__dot{box-shadow:0 0 0 2px var(--paper), 0 0 14px 1px var(--c,#888)}
@keyframes pulse{
  0%{transform:scale(.8);opacity:.95}
  70%{transform:scale(1.5);opacity:0}
  100%{transform:scale(1.5);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .node.is-unbooked .node__ring{animation:none;opacity:.9}
}
/* ── Cluster node: a pie of its members' colours, with the count below ─── */
.cluster{position:relative;width:var(--d);height:var(--d);cursor:pointer}
.cluster__pie{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid #fff;
  box-shadow:0 0 0 1.5px rgba(6,11,15,.9), 0 2px 12px -2px rgba(0,0,0,.75);
}
.cluster__ring{
  position:absolute;inset:-4px;border-radius:50%;
  border:1.5px dashed var(--warn);opacity:0;
}
.cluster.is-unbooked .cluster__ring{opacity:1}
.cluster.is-active .cluster__pie{box-shadow:0 0 0 2px var(--paper), 0 2px 12px -2px rgba(0,0,0,.7)}
.cluster__n{
  position:absolute;top:calc(var(--d) + 2px);left:50%;transform:translateX(-50%);
  font-family:var(--font-c);font-size:12px;font-weight:600;line-height:1.25;
  color:var(--paper);background:rgba(20,29,37,.88);border:1px solid var(--rule);
  border-radius:2px;padding:0 5px;white-space:nowrap;
}

.leaflet-tooltip.tip{
  background:var(--panel);border:1px solid var(--rule);color:var(--paper);
  border-radius:2px;box-shadow:none;font-size:12px;padding:3px 7px;
}
.leaflet-tooltip.tip::before{display:none}

/* ── Legend ────────────────────────────────────────────────────────────── */
.legend{
  position:absolute;left:12px;bottom:18px;z-index:600;
  background:rgba(27,40,49,.93);border:1px solid var(--rule);border-radius:3px;
  padding:9px 11px;font-size:11.5px;color:var(--muted);max-width:216px;
  backdrop-filter:blur(3px);
}
.legend__ramp{
  height:7px;border-radius:1px;margin:3px 0 4px;
  background:linear-gradient(90deg,#2a376e 0%,#3b6ed6 23%,#569cd6 38%,#e0b341 54%,#e07d3e 71%,#cb3e3d 83%,#2a376e 100%);
}
.legend__scale{display:flex;justify-content:space-between;font-family:var(--font-c);font-size:11px;letter-spacing:.04em}
.legend__modes{margin-top:9px;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center}
.legend__types{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;margin:4px 0 2px}
.legend__types i{width:11px;height:11px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.7)}
.legend__switch{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.legend__switch button{flex:1;padding:3px 0;font-size:11.5px;color:var(--muted-2)}
.legend__switch button[aria-pressed="true"]{background:var(--panel-2);color:var(--paper)}
.legend__note{font-size:10.5px;color:var(--muted-2);margin-top:2px}
.legend__modes svg{display:block}
.legend__toggle{position:absolute;right:6px;top:5px;color:var(--muted-2);font-size:15px;line-height:1;padding:2px 4px}
.legend.is-collapsed .legend__body{display:none}
.legend.is-collapsed{padding:5px 9px}
.legend.is-off{display:none}

/* ──────────────────────────────────────────────────────────────────────────
   Timeline rail — the day as a vertical schedule, with the gaps between stops
   worked out rather than left to the reader.
   ────────────────────────────────────────────────────────────────────────── */
.tl{
  position:absolute;top:0;right:0;bottom:0;width:var(--tl-w);z-index:850;
  background:var(--panel);border-left:1px solid var(--rule);
  display:flex;flex-direction:column;
}
.stage.no-tl .tl{display:none}
.tl__head{
  padding:11px 14px 9px;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
}
.tl__title{font-family:var(--font-c);font-size:19px;font-weight:600}
.tl__sub{font-size:12px;color:var(--muted-2)}
.tl__body{flex:1;overflow-y:auto;padding:6px 0 40px}
.tl__empty{padding:18px 16px;color:var(--muted-2);font-size:13px;line-height:1.5}

.ev{display:grid;grid-template-columns:52px 13px 1fr;gap:9px;padding:5px 14px 5px 10px;align-items:start}
.ev:hover{background:var(--panel-2)}
.ev.is-active{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--paper)}
.ev__t{
  font-family:var(--font-c);font-size:15px;letter-spacing:.02em;color:var(--muted);
  text-align:right;padding-top:2px;cursor:pointer;border-radius:2px;
}
.ev__t:hover{color:var(--paper);background:var(--rule)}
.ev__t.is-moved{color:var(--focus)}
.ev__dot{width:11px;height:11px;border-radius:50%;background:var(--c,#60707c);margin-top:5px;
  border:1.5px solid rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(6,11,15,.8)}
.ev__dot.is-unbooked{background:transparent;border:1.5px dashed var(--warn);box-shadow:none}
.ev__name{font-size:13.5px;line-height:1.35;cursor:pointer}
.ev__meta{font-size:11.5px;color:var(--muted-2)}
.ev__warn{font-size:11.5px;color:var(--warn)}

/* The connector between two stops: how long the hop takes and what it leaves. */
.gap{display:grid;grid-template-columns:52px 13px 1fr;gap:9px;padding:1px 14px 1px 10px;align-items:center}
.gap__line{justify-self:center;width:1px;background:var(--rule);height:100%;min-height:17px}
.gap__txt{font-size:11px;color:var(--muted-2);line-height:1.45}
.gap--tight .gap__txt{color:var(--warn)}
.gap--over .gap__txt{color:#ff8e7a}
.gap__mode{color:var(--muted)}

/* Inline time editor */
.tedit{grid-column:1 / -1;display:flex;gap:5px;align-items:center;padding:6px 0 8px 52px;flex-wrap:wrap}
.tedit button{border:1px solid var(--rule);border-radius:2px;padding:2px 7px;font-size:12px;color:var(--muted)}
.tedit button:hover{background:var(--panel-2);color:var(--paper)}
.tedit input{
  background:var(--ink);border:1px solid var(--rule);border-radius:2px;color:var(--paper);
  font:inherit;font-size:12.5px;padding:2px 5px;width:78px;
}
.tedit .tedit__reset{color:var(--focus);border-color:transparent}

.tl__foot{border-top:1px solid var(--rule);padding:8px 12px;display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);border-radius:2px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.btn:hover{background:var(--panel-2);color:var(--paper)}
.btn--on{background:var(--panel-2);color:var(--paper);border-color:var(--muted-2)}
.btn--ghost{border-color:transparent;color:var(--muted-2)}

/* ──────────────────────────────────────────────────────────────────────────
   Path tool
   ────────────────────────────────────────────────────────────────────────── */
.tools{
  position:absolute;left:12px;top:12px;z-index:600;display:flex;gap:6px;align-items:center;
  background:rgba(27,40,49,.93);border:1px solid var(--rule);border-radius:3px;padding:5px 6px;
  backdrop-filter:blur(3px);
}
.stage.drawing #map{cursor:crosshair}
.draw-bar{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:700;
  background:rgba(27,40,49,.96);border:1px solid var(--focus);border-radius:3px;
  padding:7px 12px;display:none;align-items:center;gap:12px;font-size:12.5px;
  box-shadow:0 4px 18px -6px rgba(0,0,0,.8);white-space:nowrap;
}
.stage.drawing .draw-bar{display:flex}
.draw-bar__n{color:var(--muted)}
.vertex{
  width:13px;height:13px;border-radius:50%;background:var(--focus);
  border:2px solid #0d1419;box-shadow:0 0 0 1px rgba(255,255,255,.55);cursor:move;
}
.paths{padding:4px 0 0}
.paths__row{display:flex;align-items:center;gap:7px;padding:4px 12px;font-size:12.5px}
.paths__row:hover{background:var(--panel-2)}
.paths__sw{width:10px;height:10px;border-radius:2px;background:var(--focus);flex:none}
.paths__mi{color:var(--muted-2);font-size:11px;margin-left:5px}
.paths__nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-align:left}
.paths__x{color:var(--muted-2);font-size:15px;line-height:1;padding:0 3px}
.paths__x:hover{color:var(--warn)}
.toast{
  position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:950;
  background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;
  padding:7px 14px;font-size:12.5px;color:var(--paper);opacity:0;pointer-events:none;
  transition:opacity .18s ease;box-shadow:0 4px 16px -6px rgba(0,0,0,.8);max-width:70%;
}
.toast.is-on{opacity:1}

/* ──────────────────────────────────────────────────────────────────────────
   Detail panel
   ────────────────────────────────────────────────────────────────────────── */
.detail{
  position:absolute;top:0;right:0;bottom:0;width:330px;z-index:900;
  background:var(--panel);border-left:1px solid var(--rule);
  transform:translateX(100%);transition:transform .22s ease;
  overflow-y:auto;padding:16px 18px 28px;
}
.detail.is-open{transform:none}
@media (prefers-reduced-motion:reduce){.detail{transition:none}}
.detail__close{position:absolute;top:10px;right:12px;color:var(--muted);font-size:20px;line-height:1}
.detail__kind{font-family:var(--font-c);font-size:12px;letter-spacing:.1em;color:var(--muted-2)}
.detail__title{font-family:var(--font-c);font-size:25px;font-weight:600;line-height:1.15;margin:1px 0 10px;padding-right:22px}
.detail__meta{display:grid;grid-template-columns:86px 1fr;gap:5px 12px;font-size:13.5px;margin-bottom:12px}
.detail__meta dt{color:var(--muted-2)}
.detail__meta dd{margin:0}
.detail__notes{font-size:13.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;white-space:pre-wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;
  border:1px solid var(--rule);border-radius:2px;padding:2px 8px;color:var(--muted);
}
.chip--unbooked{border-color:var(--warn);color:var(--warn)}
.chip--unbooked::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px dashed var(--warn)}
.chip--booked::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
.swatch{width:10px;height:10px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:6px}

/* ──────────────────────────────────────────────────────────────────────────
   List view
   ────────────────────────────────────────────────────────────────────────── */
#list{position:absolute;inset:0;overflow-y:auto;padding:0 0 60px;display:none;z-index:860;background:var(--ink)}
#list.is-visible{display:block}
.dayblock{border-bottom:1px solid var(--rule)}
.dayblock__head{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:14px 20px 8px;position:sticky;top:0;background:var(--ink);z-index:2;
}
.dayblock__n{font-family:var(--font-c);font-size:12px;letter-spacing:.1em;color:var(--muted-2)}
.dayblock__date{font-family:var(--font-c);font-size:21px;font-weight:600}
.dayblock__sleep{font-size:13px;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 20px 16px}
.item{
  display:grid;grid-template-columns:62px 14px 1fr;gap:12px;align-items:start;
  padding:8px 0;border-top:1px solid rgba(48,68,79,.5);width:100%;text-align:left;
}
.item:first-child{border-top:0}
.item:hover{background:rgba(34,50,61,.5)}
.item__time{font-family:var(--font-c);font-size:15px;color:var(--muted);padding-top:1px;letter-spacing:.02em}
.item__mark{width:12px;height:12px;border-radius:50%;background:var(--c,#60707c);margin-top:4px;position:relative}
.item__mark.is-unbooked{background:transparent;border:1.5px dashed var(--warn)}
.item__title{font-size:14.5px}
.item__sub{font-size:12.5px;color:var(--muted-2)}
.empty{padding:16px 20px;color:var(--muted-2);font-size:13.5px}
.list__intro{padding:18px 20px 4px;color:var(--muted);font-size:13.5px;max-width:62ch}

@media (max-width:980px){
  /* Not enough width for map and rail side by side: the rail becomes a sheet
     over the map, opened from the toolbar. */
  #map{right:0}
  .tl{width:min(340px,86vw);box-shadow:-10px 0 30px -12px rgba(0,0,0,.8)}
  .stage:not(.tl-open) .tl{display:none}
}
@media (max-width:720px){
  :root{--rail-h:70px}
  .bar__dates{display:none}
  .detail{width:auto;left:0;top:auto;height:62%;border-left:0;border-top:1px solid var(--rule);
          transform:translateY(100%);border-radius:5px 5px 0 0}
  .detail.is-open{transform:none}
  .legend{display:none}
}
</style>
</head>
<body>

<header class="bar">
  <span class="bar__title" id="tripName">Trip</span>
  <span class="bar__dates" id="tripDates"></span>
  <span class="bar__spacer"></span>
  <span class="bar__flag" id="unbookedFlag" hidden></span>
  <div class="tabs" role="tablist" aria-label="View">
    <button id="tabMap" role="tab" aria-selected="true">Map</button>
    <button id="tabList" role="tab" aria-selected="false">List</button>
  </div>
</header>

<nav class="rail" aria-label="Day">
  <button class="rail__nav" id="railPrev" aria-label="Previous day">&#8249;</button>
  <div class="rail__track" id="railTrack"></div>
  <button class="rail__nav" id="railNext" aria-label="Next day">&#8250;</button>
</nav>

<main class="stage" id="stage">
  <div id="map"></div>

  <div class="tools" id="tools">
    <button class="btn" id="btnPath">Add path</button>
    <button class="btn" id="btnAuto" aria-pressed="false" title="Snap new segments to real streets">Auto</button>
    <button class="btn btn--ghost" id="btnTl" title="Show or hide the day timeline">Timeline</button>
  </div>

  <div class="draw-bar" id="drawBar" role="status">
    <span id="drawHint">Click the map to place points</span>
    <span class="draw-bar__n" id="drawCount">0 points</span>
    <button class="btn" id="btnUndoPt">Undo point</button>
    <button class="btn btn--on" id="btnEndPath">End path</button>
    <button class="btn btn--ghost" id="btnCancelPath">Cancel</button>
  </div>

<script id="trip-app">
/* ===========================================================================
   APP
   ---------------------------------------------------------------------------
   SCOPE RULE (read before adding a feature):
   Everything lives inside this one IIFE. All mutable state is declared in the
   STATE block below, before any function that runs during boot can touch it.
   New features go inside this IIFE. There are no inline onclick handlers
   anywhere in the HTML — every listener is attached here with
   addEventListener, so nothing needs to be hung on `window`.
   =========================================================================== */
(function () {
  'use strict';

  /* ── CONFIG ────────────────────────────────────────────────────────────── */

  // 'sample' reads the inline SAMPLE block. 'notion' hits the Netlify function.
  // That is the only line that changes when the Notion side is ready.
  const SOURCE = 'sample';
  const API = '/.netlify/functions/get-trip-data';
  const SOURCES = ['days', 'flights', 'stays', 'places', 'food', 'transport'];

  /* ── STATE (declared before boot — do not move below any function call) ── */

  let map = null;
  let model = null;          // { trip, days[], items[], byId }
  let selectedDate = 'all';  // ISO date or 'all'
  let activeId = null;
  let view = 'map';          // 'map' | 'list'
  let dayLayer = null;       // LayerGroup rebuilt on every day change
  let bootError = null;
  let colourMode = 'type';   // 'type' | 'time' — what the NODE fill encodes
  let stackIds = null;       // member ids when a cluster's list is open
  let timeOverrides = {};    // itemId -> "HH:MM", edits made here rather than in Notion
  let draftPaths = [];       // paths drawn on the map, see PATH TOOL
  let drawing = null;        // in-progress path while the draw tool is active
  let editingPathId = null;  // path whose vertices are draggable
  let tlOpen = true;
  let autoRoute = false;
  let editingTimeFor = null; // itemId whose inline time editor is open
  let pathLayer = null;      // draft paths live here, separate from the day layer
  let editSecret = '';       // passphrase for the write endpoint, if set
  let saving = false;

  const el = {};             // cached DOM refs, filled in cacheDom()

  /* ── CONSTANTS ─────────────────────────────────────────────────────────── */

  // Colour is time of day. Dash pattern is mode. The two encodings are
  // deliberately orthogonal so a line reads as "6am taxi" at a glance.
  const TIME_RAMP = [
    [0,  [42, 55, 110]],   // night
    [5.5,[59, 110, 214]],  // dawn
    [9,  [86, 156, 214]],  // morning
    [13, [224, 179, 65]],  // midday
    [17, [224, 125, 62]],  // late afternoon
    [20, [203, 62, 61]],   // evening
    [24, [42, 55, 110]]    // night
  ];
  const NEUTRAL = '#60707c';

  // Three buckets, as asked for: somewhere to eat, something to see, everything
  // else (stays and route endpoints).
  const TYPE_COLOR = { food:'#f2795f', attraction:'#5ec8c4', other:'#8a99a6' };
  const TYPE_LABEL = { food:'Food', attraction:'Attraction', other:'Stay / other' };
  const TYPE_ORDER = ['food', 'attraction', 'other'];

  // Merge radius in screen pixels. Nodes closer than this to a cluster seed are
  // folded into it, so the threshold is zoom-dependent for free: zoom in and
  // the same nodes drift apart past it and separate again.
  const CLUSTER_PX = 34;

  /* ── Travel estimates ───────────────────────────────────────────────────
     Door-to-door speeds in mph, deliberately slower than the vehicle's cruising
     speed: they stand in for the whole hop including waiting, parking and
     getting lost. The straight-line distance they are applied to is shorter
     than the real route, so DETOUR scales it up — 1.3 is the usual rule of
     thumb for city street grids.
     These are estimates and the UI says so. Anything with a real duration from
     Notion uses that instead.                                              */
  const SPEED_MPH = {
    walk: 2.8, bike: 8, motorbike: 18, taxi: 14, car: 14,
    bus: 18, train: 35, ferry: 12, other: 12
  };
  const DETOUR = 1.3;
  const WALK_LIMIT_MI = 1.2;   // above this, assume you would not walk it

  // Public OSRM demo server. No key, but no uptime promise either, and the demo
  // only serves the car profile — a "walking" snap follows drivable streets,
  // which is close enough for a sketch in a city and wrong in a pedestrian zone.
  const OSRM = 'https://router.project-osrm.org/route/v1/driving/';
  const OSRM_TIMEOUT_MS = 6000;

  const LS_TIMES = 'trip.times.v1';
  const LS_PATHS = 'trip.paths.v1';
  const LS_SECRET = 'trip.secret.v1';

  const SAVE_API = '/.netlify/functions/save-trip-data';
  // Notion caps a rich-text value at 2000 characters, which is about 95
  // coordinate pairs. Simplify here rather than letting the server thin it, so
  // the path that gets saved is the one that was on screen.
  const ROUTE_MAX_PTS = 90;
  const SIMPLIFY_START_M = 4;    // metres; doubles until the path fits

  const MODES = {
    flight:    { dash: '1 13',     weight: 3.5, cap: 'round', label: 'Flight' },
    train:     { dash: '15 8',     weight: 4,   cap: 'butt',  label: 'Train' },
    bus:       { dash: '11 9',     weight: 4,   cap: 'butt',  label: 'Bus' },
    taxi:      { dash: '3 8',      weight: 4,   cap: 'round', label: 'Taxi / car' },
    car:       { dash: '3 8',      weight: 4,   cap: 'round', label: 'Taxi / car' },
    motorbike: { dash: '9 5 2 5',  weight: 3.5, cap: 'round', label: 'Motorbike' },
    bike:      { dash: '7 6',      weight: 3.5, cap: 'round', label: 'Bike' },
    walk:      { dash: '1 8',      weight: 5,   cap: 'round', label: 'Walk' },
    ferry:     { dash: '17 6 2 6', weight: 3.5, cap: 'butt',  label: 'Ferry' },
    other:     { dash: '5 5',      weight: 3.5, cap: 'butt',  label: 'Other' }
  };
  const LEGEND_MODES = ['flight', 'bus', 'taxi', 'motorbike', 'walk', 'train'];

  const KIND_LABEL = {
    flight: 'Flight', transport: 'Transport', stay: 'Stay',
    place: 'Place', food: 'Food'
  };

  /* ── SMALL HELPERS ─────────────────────────────────────────────────────── */

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function dateObj(iso) { return new Date(iso + 'T00:00:00Z'); }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = dateObj(iso);
    const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getUTCDay()];
    const mo = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()];
    return wd + ' ' + d.getUTCDate() + ' ' + mo;
  }

  function shiftDate(iso, n) {
    const d = dateObj(iso);
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function datesBetween(a, b) {   // [a, b) — nights, not days
    const out = [];
    if (!a) return out;
    let cur = a;
    const stop = b || shiftDate(a, 1);
    let guard = 0;
    while (cur < stop && guard++ < 400) { out.push(cur); cur = shiftDate(cur, 1); }
    return out.length ? out : [a];
  }

  function parseHM(s) {               // "21:15" -> 21.25, else null
    if (!s) return null;
    const m = /^(\d{1,2}):(\d{2})/.exec(String(s).trim());
    if (!m) return null;
    return (+m[1]) + (+m[2]) / 60;
  }

  function fmtMin(n) {
    if (n == null) return null;
    const h = Math.floor(n / 60), m = n % 60;
    return (h ? h + ' h ' : '') + (m ? m + ' min' : (h ? '' : '0 min'));
  }

  function timeColor(hhmm) {
    const h = parseHM(hhmm);
    if (h == null) return NEUTRAL;
    for (let i = 1; i < TIME_RAMP.length; i++) {
      if (h <= TIME_RAMP[i][0]) {
        const [h0, c0] = TIME_RAMP[i - 1], [h1, c1] = TIME_RAMP[i];
        const t = (h - h0) / (h1 - h0);
        const c = c0.map(function (v, k) { return Math.round(v + (c1[k] - v) * t); });
        return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
      }
    }
    return NEUTRAL;
  }

  // "10.78,106.69; 10.79,106.70" -> [[10.78,106.69],[10.79,106.70]].
  // Tolerant on separators because these get pasted from Google Maps by hand:
  // semicolons, newlines or pipes all split, and stray whitespace is ignored.
  // A pair that is not two finite numbers in range is dropped rather than
  // poisoning the whole line.
  function parseRoute(str) {
    if (!str) return null;
    const pts = String(str).split(/[;|\n]+/).map(function (chunk) {
      const m = chunk.trim().match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
      if (!m) return null;
      const la = parseFloat(m[1]), ln = parseFloat(m[2]);
      if (!isFinite(la) || !isFinite(ln)) return null;
      if (la < -90 || la > 90 || ln < -180 || ln > 180) return null;
      return [la, ln];
    }).filter(Boolean);
    return pts.length >= 2 ? pts : null;     // one point is a dot, not a path
  }

  /* ── GEOMETRY ──────────────────────────────────────────────────────────── */

  const R = Math.PI / 180, D = 180 / Math.PI;

  // Great-circle interpolation. Longitudes are returned UNWRAPPED (they can run
  // past ±180) so a Pacific crossing stays one continuous line instead of
  // snapping back across the whole map. drawLeg() then renders the same path at
  // -360 / 0 / +360 so it is visible in whichever world copy is on screen.
  function greatCircle(a, b, n) {
    n = n || 64;
    const lat1 = a[0] * R, lon1 = a[1] * R, lat2 = b[0] * R, lon2 = b[1] * R;
    const dl = Math.sin((lat1 - lat2) / 2) ** 2 +
               Math.cos(lat1) * Math.cos(lat2) * Math.sin((lon1 - lon2) / 2) ** 2;
    const d = 2 * Math.asin(Math.min(1, Math.sqrt(dl)));
    if (!isFinite(d) || d < 1e-9) return [[a[0], a[1]], [b[0], b[1]]];

    const pts = [];
    for (let i = 0; i <= n; i++) {
      const f = i / n;
      const A = Math.sin((1 - f) * d) / Math.sin(d);
      const B = Math.sin(f * d) / Math.sin(d);
      const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
      const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
      const z = A * Math.sin(lat1) + B * Math.sin(lat2);
      pts.push([Math.atan2(z, Math.hypot(x, y)) * D, Math.atan2(y, x) * D]);
    }
    for (let i = 1; i < pts.length; i++) {          // unwrap the antimeridian
      const delta = pts[i][1] - pts[i - 1][1];
      if (delta > 180) pts[i][1] -= 360;
      else if (delta < -180) pts[i][1] += 360;
    }
    return pts;
  }

  // Summed leg-by-leg, so a multi-point route measures along the path rather
  // than end to end.
  function routeMiles(pts) {
    let m = 0;
    for (let i = 1; i < pts.length; i++) m += gcMilesExact(pts[i - 1], pts[i]);
    return m < 10 ? m.toFixed(1) : String(Math.round(m));
  }

  function gcMilesExact(a, b) {
    const dl = Math.sin((a[0] - b[0]) * R / 2) ** 2 +
               Math.cos(a[0] * R) * Math.cos(b[0] * R) * Math.sin((a[1] - b[1]) * R / 2) ** 2;
    return 2 * 3958.8 * Math.asin(Math.min(1, Math.sqrt(dl)));
  }

  function gcMiles(a, b) {
    const dl = Math.sin((a[0] - b[0]) * R / 2) ** 2 +
               Math.cos(a[0] * R) * Math.cos(b[0] * R) * Math.sin((a[1] - b[1]) * R / 2) ** 2;
    return Math.round(2 * 3958.8 * Math.asin(Math.min(1, Math.sqrt(dl))));
  }

  /* ── Simplification ─────────────────────────────────────────────────────
     Douglas-Peucker. An auto-routed path comes back with hundreds of points
     and Notion will not hold that in one value, so the line is reduced to the
     points that actually define its shape. Endpoints are never dropped.
     Distances are computed in a local flat projection, which is accurate
     enough over the few kilometres a walking route covers and far cheaper than
     a spherical calculation per point.
     ───────────────────────────────────────────────────────────────────────── */

  function perpDistM(pt, a, b) {
    const latRad = a[0] * R;
    const mx = 111320 * Math.cos(latRad), my = 110540;
    const px = pt[1] * mx, py = pt[0] * my;
    const ax = a[1] * mx, ay = a[0] * my;
    const bx = b[1] * mx, by = b[0] * my;
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * dx + (py - ay) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  function rdp(pts, tol) {
    if (pts.length < 3) return pts.slice();
    let maxD = -1, idx = 0;
    for (let i = 1; i < pts.length - 1; i++) {
      const d = perpDistM(pts[i], pts[0], pts[pts.length - 1]);
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (maxD <= tol) return [pts[0], pts[pts.length - 1]];
    const left = rdp(pts.slice(0, idx + 1), tol);
    const right = rdp(pts.slice(idx), tol);
    return left.slice(0, -1).concat(right);
  }

  // Loosen the tolerance until the path fits, so the result is always storable
  // however wiggly the input.
  function simplifyForStorage(pts) {
    if (!pts || pts.length <= ROUTE_MAX_PTS) return pts ? pts.slice() : [];
    let tol = SIMPLIFY_START_M, out = pts;
    for (let i = 0; i < 24 && out.length > ROUTE_MAX_PTS; i++) {
      out = rdp(pts, tol);
      tol *= 2;
    }
    if (out.length > ROUTE_MAX_PTS) {
      // Pathological input: fall back to evenly spaced points, keeping the ends.
      const step = (pts.length - 1) / (ROUTE_MAX_PTS - 1);
      out = [];
      for (let i = 0; i < ROUTE_MAX_PTS; i++) out.push(pts[Math.round(i * step)]);
      out[out.length - 1] = pts[pts.length - 1];
    }
    return out;
  }

  /* ── DATA LOADING ──────────────────────────────────────────────────────── */

  // The single swap point between sample data and live Notion. Both paths must
  // return the same shape; nothing downstream knows which one ran.
  async function loadRaw() {
    if (SOURCE === 'sample') return window.SAMPLE;

    const out = {};
    const results = await Promise.all(SOURCES.map(async function (s) {
      const res = await fetch(API + '?source=' + encodeURIComponent(s));
      if (!res.ok) throw new Error(s + ': HTTP ' + res.status + ' — ' + (await res.text()).slice(0, 200));
      return [s, await res.json()];
    }));
    results.forEach(function (p) { out[p[0]] = p[1]; });
    out.trip = (out.days && out.days.trip) || window.SAMPLE.trip;
    return out;
  }

  function airport(code) {
    const a = window.AIRPORTS[code];
    if (!a) return null;
    const label = a.name && a.name !== a.city ? a.city + ' (' + a.name + ')' : a.city;
    return { code: code, name: label, lat: a.lat, lng: a.lng };
  }

  /* ── MODEL ─────────────────────────────────────────────────────────────── */

  function buildModel(raw) {
    const days = (raw.days || []).map(function (d, i) {
      return { date: d.date, n: i + 1, sleeping: d.sleeping, base: d.base, summary: d.summary };
    });
    const items = [];

    (raw.flights || []).forEach(function (f) {
      const from = airport(f.from), to = airport(f.to);
      if (!from || !to) return;                     // unknown IATA — add it to AIRPORTS
      const fields = [
        ['Route', from.name + ' → ' + to.name],
        ['Flight', [f.airline, f.flightNo].filter(Boolean).join(' ') || null],
        ['Departs', f.depLocal ? f.depLocal + ' local' : null],
        ['Arrives', f.arrLocal ? f.arrLocal + ' local' : null],
        ['In the air', fmtMin(f.durationMin)],
        ['Distance', gcMiles([from.lat, from.lng], [to.lat, to.lng]) + ' mi great-circle'],
        ['Price', f.price != null ? '$' + f.price : null]
      ];
      items.push({
        durationMin: f.durationMin != null ? f.durationMin : null,
        id: f.id, kind: 'flight', geo: 'leg', mode: 'flight',
        title: f.from + ' → ' + f.to,
        subtitle: from.name + ' to ' + to.name,
        dates: [f.date], time: f.depLocal || f.arrLocal, booked: f.booked,
        from: from, to: to, fields: fields, notes: f.notes, link: f.link
      });
    });

    // Name lookup for transport endpoints. Built from everything that has a
    // position, so a Walk row can say From "Hoi An Airbnb" / To "Market Bar"
    // and skip retyping four numbers. Explicit coordinates always win; this
    // only fills blanks.
    const byName = {};
    function remember(name, lat, lng) {
      if (!name || lat == null || lng == null) return;
      const k = name.trim().toLowerCase();
      if (!(k in byName)) byName[k] = { lat: lat, lng: lng };   // first wins
    }
    (raw.stays  || []).forEach(function (x) { remember(x.name, x.lat, x.lng); });
    (raw.places || []).forEach(function (x) {
      const r = parseRoute(x.route);
      remember(x.name, x.lat != null ? x.lat : (r && r[0][0]),
                       x.lng != null ? x.lng : (r && r[0][1]));
    });
    (raw.food   || []).forEach(function (x) { remember(x.name, x.lat, x.lng); });
    Object.keys(window.AIRPORTS || {}).forEach(function (code) {
      const a = window.AIRPORTS[code];
      remember(code, a.lat, a.lng);
      remember(a.city, a.lat, a.lng);
    });

    function resolve(name, lat, lng) {
      if (lat != null && lng != null) return { lat: lat, lng: lng, derived: false };
      const hit = name ? byName[String(name).trim().toLowerCase()] : null;
      if (hit) return { lat: hit.lat, lng: hit.lng, derived: true };
      return { lat: lat, lng: lng, derived: false };
    }

    (raw.transport || []).forEach(function (t) {
      const A = resolve(t.fromName, t.fromLat, t.fromLng);
      const B = resolve(t.toName,   t.toLat,   t.toLng);
      const fields = [
        ['Mode', (MODES[t.mode] || MODES.other).label],
        ['Route', t.fromName + ' → ' + t.toName],
        ['Departs', t.depLocal ? t.depLocal + ' local' : null],
        ['Arrives', t.arrLocal ? t.arrLocal + ' local' : null],
        ['Duration', fmtMin(t.durationMin)],
        ['Distance', t.distanceMi != null ? t.distanceMi + ' mi'
          : (A.lat != null && B.lat != null
              ? gcMiles([A.lat, A.lng], [B.lat, B.lng]) + ' mi straight-line' : null)],
        ['Elevation', t.elevationFt != null ? '+' + t.elevationFt + ' ft' : null],
        ['Price', t.price != null ? '$' + t.price : null]
      ];
      if (A.derived || B.derived) {
        fields.push(['Position', 'from ' +
          [A.derived ? t.fromName : null, B.derived ? t.toName : null]
            .filter(Boolean).join(' and ')]);
      }
      const legRoute = parseRoute(t.route);
      items.push({
        durationMin: t.durationMin != null ? t.durationMin : null,
        route: legRoute,
        drawnOnSite: !!t.drawnOnSite,
        id: t.id, kind: 'transport', geo: 'leg', mode: t.mode || 'other',
        title: t.label || (t.fromName + ' → ' + t.toName),
        subtitle: t.fromName + ' → ' + t.toName,
        dates: t.endDate ? [t.date, t.endDate] : [t.date],
        time: t.depLocal, booked: t.booked,
        from: { name: t.fromName, lat: A.lat, lng: A.lng },
        to: { name: t.toName, lat: B.lat, lng: B.lng },
        fields: fields, notes: t.notes, link: t.link, linkedTo: t.linkedTo || []
      });
    });

    (raw.stays || []).forEach(function (s) {
      const nights = datesBetween(s.checkIn, s.checkOut);
      const fields = [
        ['Where', s.location],
        ['Check in', fmtDate(s.checkIn)],
        ['Check out', fmtDate(s.checkOut)],
        ['Nights', String(nights.length)],
        ['Price', s.price != null ? '$' + s.price : null]
      ];
      items.push({
        id: s.id, kind: 'stay', geo: 'point',
        title: s.name, subtitle: s.location,
        dates: nights, time: '20:00', timeIsDefault: true, booked: s.booked,
        lat: s.lat, lng: s.lng, fields: fields, notes: s.notes, link: s.link
      });
    });

    (raw.places || []).forEach(function (p) {
      const route = parseRoute(p.route);
      // A place with a route still has a node — at its own coordinates if given,
      // otherwise at the start of the path, so the two never disagree.
      const lat = p.lat != null ? p.lat : (route ? route[0][0] : null);
      const lng = p.lng != null ? p.lng : (route ? route[0][1] : null);
      items.push({
        id: p.id, kind: 'place', geo: 'point',
        title: p.name, subtitle: p.category || null,
        dates: [p.date], time: p.time, booked: p.booked,
        lat: lat, lng: lng, route: route,
        areaRadius: (p.areaRadius != null && p.areaRadius > 0) ? p.areaRadius : null,
        fields: [
          ['Category', p.category],
          ['Time', p.time],
          ['Area', p.areaRadius ? Math.round(p.areaRadius) + ' m across the middle' : null],
          ['Walk', route ? route.length + ' points, ' + routeMiles(route) + ' mi' : null]
        ],
        notes: p.notes, link: p.link
      });
    });

    (raw.food || []).forEach(function (f) {
      items.push({
        id: f.id, kind: 'food', geo: 'point',
        title: f.name, subtitle: f.type || null,
        dates: [f.date], time: f.time, booked: f.booked,
        lat: f.lat, lng: f.lng,
        fields: [
          ['Type', f.type],
          ['Open', f.openTime],
          ['Reservation', f.reservation],
          ['Confidence', f.confidence != null ? f.confidence + ' / 5' : null]
        ],
        notes: f.notes, link: f.link
      });
    });

    const byId = {};
    items.forEach(function (i) { byId[i.id] = i; });
    return { trip: raw.trip, days: days, items: items, byId: byId };
  }

  function itemsOn(date) {
    if (date === 'all') return model.items.slice();
    return model.items.filter(function (i) { return i.dates.indexOf(date) !== -1; });
  }

  // `get` lets callers sort by the effective (possibly overridden) time rather
  // than the one baked into the item.
  function sortByTime(list, get) {
    const read = get || function (i) { return i.time; };
    return list.slice().sort(function (a, b) {
      const ta = parseHM(read(a)), tb = parseHM(read(b));
      if (ta == null && tb == null) return 0;
      if (ta == null) return 1;
      if (tb == null) return -1;
      return ta - tb;
    });
  }

  function typeOf(i) {
    if (i.kind === 'food') return 'food';
    if (i.kind === 'place') return 'attraction';
    return 'other';                       // stays, and the endpoints of legs
  }

  // Paths always encode time of day: a leg has a mode, not a food/sight type,
  // and colouring every path slate grey would throw that information away.
  function legColor(i) { return i.timeIsDefault ? NEUTRAL : timeColor(i.time); }

  function nodeColor(i) {
    if (colourMode === 'type') return TYPE_COLOR[typeOf(i)];
    return i.timeIsDefault && i.kind !== 'stay' ? NEUTRAL : timeColor(i.time);
  }

  // One entry point so the list view always matches what the map draws.
  function itemColor(i) { return i.geo === 'leg' ? legColor(i) : nodeColor(i); }

  /* ──────────────────────────────────────────────────────────────────────
     LOCAL EDITS
     Times you nudge and paths you draw are kept in this browser, not written
     back to Notion: the Netlify function is read-only by design and the site
     is on a public URL, so a write endpoint would let anyone who found it edit
     the trip. Everything here therefore offers a copy-out instead.
     Every read and write is wrapped: storage throws in private windows and
     comes back empty when site data is cleared, and neither should break the
     page.
     ────────────────────────────────────────────────────────────────────── */

  function lsGet(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      if (!raw) return fallback;
      const v = JSON.parse(raw);
      return v == null ? fallback : v;
    } catch (e) { return fallback; }
  }

  function lsSet(key, value) {
    try { window.localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { toast('Could not save locally — private window or storage full.'); return false; }
  }

  let toastTimer = null;
  function toast(msg) {
    if (!el.toast) return;
    el.toast.textContent = msg;
    el.toast.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('is-on'); }, 2600);
  }

  function copyText(text, okMsg) {
    const done = function () { toast(okMsg || 'Copied'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
      } else { fallbackCopy(text, done); }
    } catch (e) { fallbackCopy(text, done); }
  }

  // Clipboard API needs a secure context and a user gesture; this works where
  // it does not.
  function fallbackCopy(text, done) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:absolute;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) { toast('Copy failed — select the value and copy it by hand.'); }
  }

  /* ── Effective time: an override wins over whatever Notion says ───────── */

  function timeOf(item) {
    if (!item) return null;
    const o = timeOverrides[item.id];
    return o || item.time;
  }

  function isMoved(item) {
    const o = timeOverrides[item.id];
    return !!o && o !== item.time;
  }

  function setTimeOverride(id, hhmm) {
    const item = model.byId[id];
    if (!item) return;
    if (!hhmm || hhmm === item.time) delete timeOverrides[id];
    else timeOverrides[id] = hhmm;
    lsSet(LS_TIMES, timeOverrides);
    refreshAll();
  }

  function clampHM(h) {                      // keep nudges inside one day
    return Math.max(0, Math.min(23.9833, h));
  }

  function hmToStr(h) {
    const hh = Math.floor(h);
    const mm = Math.round((h - hh) * 60);
    const carry = mm === 60;
    return String((carry ? hh + 1 : hh) % 24).padStart(2, '0') + ':' +
           String(carry ? 0 : mm).padStart(2, '0');
  }

  function nudgeTime(id, mins) {
    const item = model.byId[id];
    const base = parseHM(timeOf(item));
    if (base == null) return;
    setTimeOverride(id, hmToStr(clampHM(base + mins / 60)));
  }

  /* ── MAP ───────────────────────────────────────────────────────────────── */

  function initMap() {
    map = L.map('map', { zoomControl: true, worldCopyJump: false, minZoom: 2 })
           .setView([16, 107], 5);

    // Plain OpenStreetMap tiles: no account, no API key, no usage token. The
    // dark look comes from a CSS filter applied to .leaflet-tile-pane only, so
    // markers and polylines (separate panes) keep their real colours.
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Custom panes, not z-index on sibling elements: anything outside
    // .leaflet-map-pane cannot be ordered against Leaflet's own panes.
    // Bottom to top: amber unbooked halo, dark casing, coloured line. The
    // casing is what makes a thin dashed path legible over pale roads — a glow
    // alone washes out against a light background.
    map.createPane('areas').style.zIndex = 360;
    map.createPane('legHalo').style.zIndex = 370;
    map.createPane('legCase').style.zIndex = 380;
    map.createPane('legs').style.zIndex = 390;
    dayLayer = L.layerGroup().addTo(map);
    pathLayer = L.layerGroup().addTo(map);

    map.on('click', function (e) {
      if (drawing) addDrawPoint(e.latlng.lat, e.latlng.lng, false);
    });

    // Cluster membership is a function of zoom, so it has to be recomputed on
    // every zoom change. Never re-fit here: that would fight the user's own
    // zooming, and fitBounds itself fires zoomend.
    map.on('zoomend', function () { renderMap(false); });
  }

  /* ── Clustering ─────────────────────────────────────────────────────────
     Seeded greedy grouping in screen space: walk the points in order, and for
     each one not yet taken, absorb every remaining point within CLUSTER_PX of
     IT. Distances are measured to the seed, never transitively, so a long
     string of nodes cannot chain into one giant blob — each cluster stays
     within one radius of its own seed.
     Only free-standing nodes cluster. Leg endpoints stay put, so a flight or
     bus line always terminates on a visible node rather than in empty space.
     ───────────────────────────────────────────────────────────────────────── */
  function clusterPoints(list) {
    if (!map || !list.length) return list.map(function (i) { return [i]; });

    let pts;
    try {
      pts = list.map(function (i) {
        const p = map.latLngToContainerPoint([i.lat, i.lng]);
        return { item: i, x: p.x, y: p.y, taken: false };
      });
    } catch (e) {
      return list.map(function (i) { return [i]; });   // map not sized yet
    }

    const groups = [];
    for (let a = 0; a < pts.length; a++) {
      if (pts[a].taken) continue;
      pts[a].taken = true;
      const group = [pts[a].item];
      for (let b = a + 1; b < pts.length; b++) {
        if (pts[b].taken) continue;
        const dx = pts[b].x - pts[a].x, dy = pts[b].y - pts[a].y;
        if (Math.sqrt(dx * dx + dy * dy) <= CLUSTER_PX) {
          pts[b].taken = true;
          group.push(pts[b].item);
        }
      }
      groups.push(group);
    }
    return groups;
  }

  function centroid(items) {
    let la = 0, ln = 0;
    items.forEach(function (i) { la += i.lat; ln += i.lng; });
    return [la / items.length, ln / items.length];
  }

  // The blend: slice the disc in proportion to what is inside it, so the
  // dominant colour is literally the dominant share of the ring.
  function blendStops(items) {
    const n = items.length;
    const parts = [];

    if (colourMode === 'type') {
      const counts = { food: 0, attraction: 0, other: 0 };
      items.forEach(function (i) { counts[typeOf(i)]++; });
      TYPE_ORDER.forEach(function (k) {
        if (counts[k]) parts.push({ color: TYPE_COLOR[k], n: counts[k] });
      });
    } else {
      sortByTime(items).forEach(function (i) {
        parts.push({ color: nodeColor(i), n: 1 });
      });
    }
    if (!parts.length) return NEUTRAL;
    if (parts.length === 1) return parts[0].color;

    let acc = 0;
    const stops = parts.map(function (p) {
      const from = (acc / n) * 100;
      acc += p.n;
      const to = (acc / n) * 100;
      return p.color + ' ' + from.toFixed(2) + '% ' + to.toFixed(2) + '%';
    });
    return 'conic-gradient(from -90deg, ' + stops.join(', ') + ')';
  }

  function clusterIcon(items) {
    const d = Math.round(30 + Math.min(14, (items.length - 1) * 3));
    const fill = blendStops(items);
    const cls = ['cluster'];
    if (items.some(function (i) { return i.booked === false; })) cls.push('is-unbooked');
    if (items.some(function (i) { return i.id === activeId; })) cls.push('is-active');

    return L.divIcon({
      className: '',
      iconSize: [d, d + 18], iconAnchor: [d / 2, d / 2],
      html: '<div class="' + cls.join(' ') + '" style="--d:' + d + 'px">' +
            '<span class="cluster__ring"></span>' +
            '<span class="cluster__pie" style="background:' + fill + '"></span>' +
            '<span class="cluster__n">' + items.length + '</span>' +
            '</div>'
    });
  }

  function addCluster(items) {
    const c = centroid(items);
    const names = items.slice(0, 4).map(function (i) { return i.title; });
    if (items.length > 4) names.push('+ ' + (items.length - 4) + ' more');

    L.marker(c, { icon: clusterIcon(items), riseOnHover: true, zIndexOffset: 400 })
      .bindTooltip(names.join('<br>'), { className: 'tip', direction: 'top', offset: [0, -14] })
      .on('click', function () { openCluster(items); })
      .addTo(dayLayer);
  }

  // Clicking a cluster zooms far enough to break it apart. When its members sit
  // on the same coordinates there is no zoom that separates them, so list them
  // in the panel instead of leaving the click dead.
  function openCluster(items) {
    const lats = items.map(function (i) { return i.lat; });
    const lngs = items.map(function (i) { return i.lng; });
    const spread = Math.max(Math.max.apply(null, lats) - Math.min.apply(null, lats),
                            Math.max.apply(null, lngs) - Math.min.apply(null, lngs));

    if (spread > 1e-5 && map.getZoom() < 17) {
      map.fitBounds(L.latLngBounds(items.map(function (i) { return [i.lat, i.lng]; })),
                    { padding: [80, 80], maxZoom: 17 });
    } else {
      showStack(items);
    }
  }

  function nodeIcon(item, kind) {
    const cls = ['node', 'node--' + kind];
    if (item.booked === false) cls.push('is-unbooked');
    if (item.id === activeId) cls.push('is-active');
    return L.divIcon({
      className: '',
      iconSize: [22, 22], iconAnchor: [11, 11],
      html: '<div class="' + cls.join(' ') + '" style="--c:' + nodeColor(item) + '">' +
            '<span class="node__ring"></span><span class="node__dot"></span></div>'
    });
  }

  function addNode(item, lat, lng, kind, label) {
    if (lat == null || lng == null) return null;
    const m = L.marker([lat, lng], { icon: nodeIcon(item, kind), riseOnHover: true })
               .bindTooltip(label || item.title, { className: 'tip', direction: 'top', offset: [0, -10] })
               .on('click', function () {
                 // While drawing, a node is a snap target that also ends the
                 // path — the behaviour asked for, and it beats trying to click
                 // exactly on a marker's centre by hand.
                 if (drawing) { addDrawPoint(lat, lng, true); return; }
                 select(item.id);
               });
    m.addTo(dayLayer);
    return m;
  }

  function drawLeg(item) {
    const a = item.from, b = item.to;
    if (a.lat == null || b.lat == null) return [];
    const style = MODES[item.mode] || MODES.other;
    // A traced route wins over the computed arc: it is the real path someone
    // walked out on the map rather than a line between two points.
    const pts = item.route && item.route.length > 1
      ? item.route.slice()
      : greatCircle([a.lat, a.lng], [b.lat, b.lng], item.mode === 'flight' ? 96 : 32);
    const colour = legColor(item);
    const bounds = [];

    [-360, 0, 360].forEach(function (off) {
      const shifted = pts.map(function (p) { return [p[0], p[1] + off]; });
      if (item.booked === false) {
        L.polyline(shifted, {
          pane: 'legHalo', color: '#f2d08a', weight: style.weight + 7,
          opacity: 0.18, dashArray: '5 7', interactive: false
        }).addTo(dayLayer);
      }
      // Dark casing: same dash, wider stroke, drawn underneath. Each dash ends
      // up outlined rather than sitting bare on the map.
      L.polyline(shifted, {
        pane: 'legCase', color: '#060b0f', weight: style.weight + 4.5,
        opacity: 0.88, dashArray: style.dash, lineCap: style.cap,
        interactive: false
      }).addTo(dayLayer);

      L.polyline(shifted, {
        pane: 'legs', color: colour, weight: style.weight, opacity: 1,
        dashArray: style.dash, lineCap: style.cap, interactive: true
      }).on('click', function () { select(item.id); })
        .bindTooltip(item.title, { className: 'tip', sticky: true })
        .addTo(dayLayer);
    });

    addNode(item, a.lat, a.lng, 'hub', a.name);
    addNode(item, b.lat, b.lng, 'hub', b.name);
    // Endpoints only. The arc points are unwrapped past +/-180, so fitting to
    // them would zoom a Pacific crossing out past the whole world.
    bounds.push([a.lat, a.lng], [b.lat, b.lng]);
    return bounds;
  }

  // A place whose geometry IS a path — "walk around District 3". Drawn with the
  // walk dash and the place's own colour, because it belongs to that place
  // rather than being a leg between two of them.
  function drawRoute(item) {
    const style = MODES.walk;
    const colour = nodeColor(item);

    L.polyline(item.route, {
      pane: 'legCase', color: '#060b0f', weight: style.weight + 4.5,
      opacity: 0.88, dashArray: style.dash, lineCap: style.cap, interactive: false
    }).addTo(dayLayer);

    if (item.booked === false) {
      L.polyline(item.route, {
        pane: 'legHalo', color: '#f2d08a', weight: style.weight + 8,
        opacity: 0.18, dashArray: '5 7', interactive: false
      }).addTo(dayLayer);
    }

    L.polyline(item.route, {
      pane: 'legs', color: colour, weight: style.weight, opacity: 1,
      dashArray: style.dash, lineCap: style.cap, interactive: true
    }).on('click', function () { select(item.id); })
      .bindTooltip(item.title, { className: 'tip', sticky: true })
      .addTo(dayLayer);

    // A small open marker at the far end, so the direction of travel is visible.
    const end = item.route[item.route.length - 1];
    addNode(item, end[0], end[1], 'waypoint', item.title + ' — end');
  }

  // An entry that is a neighbourhood rather than a pin — "walk around District
  // 3". A soft disc says "somewhere in here" without inventing a route through
  // streets nobody picked yet.
  function drawArea(item) {
    const c = nodeColor(item);
    L.circle([item.lat, item.lng], {
      pane: 'areas', radius: item.areaRadius,
      color: c, weight: 1.5, opacity: 0.55, dashArray: '3 5',
      fillColor: c, fillOpacity: 0.1, interactive: true
    }).on('click', function () { select(item.id); })
      .bindTooltip(item.title, { className: 'tip', sticky: true })
      .addTo(dayLayer);
  }

  function renderMap(fit) {
    if (!map) return;
    dayLayer.clearLayers();
    const list = itemsOn(selectedDate);
    const bounds = [];

    // Legs first: their endpoints are drawn as hubs and never clustered.
    // A path that has been saved exists twice: as a local draft (still
    // editable) and as the Transport row it became. Draw only the draft, or
    // the two render on top of each other.
    const savedIds = {};
    draftPaths.forEach(function (p) { if (p.notionId) savedIds[p.notionId] = true; });

    const points = [];
    list.forEach(function (i) {
      if (i.geo === 'leg' && savedIds[i.id]) return;
      if (i.geo === 'leg') {
        drawLeg(i).forEach(function (p) { bounds.push(p); });
      } else if (i.lat != null && i.lng != null) {
        if (i.areaRadius) {
          drawArea(i);
          // Keep the whole disc in view, not just its centre.
          const dLat = i.areaRadius / 111320;
          const dLng = i.areaRadius / (111320 * Math.cos(i.lat * R));
          bounds.push([i.lat - dLat, i.lng - dLng], [i.lat + dLat, i.lng + dLng]);
        }
        if (i.route) {
          drawRoute(i);
          i.route.forEach(function (pt) { bounds.push(pt); });
        }
        points.push(i);
        bounds.push([i.lat, i.lng]);
      }
    });

    clusterPoints(points).forEach(function (group) {
      if (group.length === 1) addNode(group[0], group[0].lat, group[0].lng, group[0].kind);
      else addCluster(group);
    });

    if (fit && bounds.length) {
      map.fitBounds(L.latLngBounds(bounds), { padding: [70, 70], maxZoom: 12, animate: false });
    }
    map.invalidateSize();
  }

  /* ──────────────────────────────────────────────────────────────────────
     TIMELINE
     The day as a vertical schedule. The value is in the gaps: between each
     pair of stops it works out how long the hop takes and therefore how long
     you actually get at the first one — which is the number that tells you
     whether a plan holds together.
     ────────────────────────────────────────────────────────────────────── */

  function positionOf(i) {
    if (i.geo === 'leg') return i.to && i.to.lat != null ? [i.to.lat, i.to.lng] : null;
    return i.lat != null ? [i.lat, i.lng] : null;
  }

  function startOf(i) {
    if (i.geo === 'leg') return i.from && i.from.lat != null ? [i.from.lat, i.from.lng] : null;
    return i.lat != null ? [i.lat, i.lng] : null;
  }

  // How long to get from one stop to the next, and how sure we are.
  // Order of preference: a real duration recorded in Notion, then a distance
  // estimate, then nothing at all — never a confident-looking guess.
  function hop(from, to) {
    // A leg carries its own duration, which beats any estimate.
    if (to.geo === 'leg' && to.durationMin != null) {
      return { mins: to.durationMin, mode: to.mode, exact: true };
    }
    const a = positionOf(from), b = startOf(to);
    if (!a || !b) return null;

    const miles = gcMilesExact(a, b) * DETOUR;
    if (miles < 0.03) return { mins: 0, mode: 'walk', exact: false, miles: miles };

    const mode = to.geo === 'leg' ? (to.mode || 'other')
               : (miles <= WALK_LIMIT_MI ? 'walk' : 'taxi');
    const mph = SPEED_MPH[mode] || SPEED_MPH.other;
    return { mins: Math.round(miles / mph * 60), mode: mode, exact: false, miles: miles };
  }

  // Items that can sit on a timeline: they need a time to be placed at all.
  function timelineItems(date) {
    return sortByTime(itemsOn(date).filter(function (i) {
      return parseHM(timeOf(i)) != null;
    }), timeOf);
  }

  function fmtGap(n) {
    if (n == null) return '';
    const a = Math.abs(Math.round(n));
    if (a < 60) return a + ' min';
    const h = Math.floor(a / 60), m = a % 60;
    return h + ' h' + (m ? ' ' + m + ' min' : '');
  }

  // Parses "06:00–22:00 daily" / "10:00–13:50 and 16:00–20:50" into ranges.
  // Deliberately strict: anything it cannot read with confidence returns null
  // and no warning is shown, because a false "closed!" is worse than silence.
  function openRanges(str) {
    if (!str) return null;
    const out = [];
    const re = /(\d{1,2})[:.](\d{2})\s*(?:am|pm)?\s*[–—\-]\s*(\d{1,2})[:.](\d{2})\s*(am|pm)?/gi;
    let m;
    while ((m = re.exec(str))) {
      let a = +m[1] + (+m[2]) / 60;
      let b = +m[3] + (+m[4]) / 60;
      const suffix = (m[5] || '').toLowerCase();
      if (suffix === 'pm' && b < 12) b += 12;
      if (b <= a) b += 24;                       // closes after midnight
      out.push([a, b]);
    }
    return out.length ? out : null;
  }

  function closedWarning(item) {
    const hours = (item.fields || []).find(function (f) { return f[0] === 'Open'; });
    const ranges = openRanges(hours && hours[1]);
    const t = parseHM(timeOf(item));
    if (!ranges || t == null) return null;
    const inside = ranges.some(function (r) {
      return (t >= r[0] && t <= r[1]) || (t + 24 >= r[0] && t + 24 <= r[1]);
    });
    return inside ? null : 'outside opening hours';
  }

  function renderTimeline() {
    if (!el.tlBody) return;
    const date = selectedDate;

    if (date === 'all') {
      el.tlTitle.textContent = 'Timeline';
      el.tlSub.textContent = '';
      el.tlBody.innerHTML = '<p class="tl__empty">Pick a day above to see its schedule, ' +
        'with travel time worked out between each stop.</p>';
      renderTlFoot();
      return;
    }

    const day = model.days.find(function (d) { return d.date === date; });
    const list = timelineItems(date);
    el.tlTitle.textContent = fmtDate(date);
    el.tlSub.textContent = day ? ('Day ' + day.n + (day.sleeping ? ' · ' + day.sleeping : '')) : '';

    if (!list.length) {
      el.tlBody.innerHTML = '<p class="tl__empty">Nothing on this day has a time yet. ' +
        'Give an entry a time in Notion and it appears here.</p>';
      renderTlFoot();
      return;
    }

    const rows = [];
    list.forEach(function (i, idx) {
      const moved = isMoved(i);
      const warn = closedWarning(i);
      const sub = [i.subtitle, warn].filter(Boolean).join(' · ');

      rows.push(
        '<div class="ev' + (i.id === activeId ? ' is-active' : '') + '" data-ev="' + esc(i.id) + '">' +
          '<button class="ev__t' + (moved ? ' is-moved' : '') + '" data-tedit="' + esc(i.id) + '" ' +
            'title="' + (moved ? 'Moved from ' + esc(i.time || '—') : 'Change the time') + '">' +
            esc(timeOf(i) || '—') + (moved ? ' •' : '') + '</button>' +
          '<span class="ev__dot' + (i.booked === false ? ' is-unbooked' : '') +
            '" style="--c:' + itemColor(i) + '"></span>' +
          '<span><span class="ev__name" data-ev-open="' + esc(i.id) + '">' + esc(i.title) + '</span>' +
            (sub ? '<br><span class="' + (warn ? 'ev__warn' : 'ev__meta') + '">' + esc(sub) + '</span>' : '') +
          '</span>' +
          (editingTimeFor === i.id ? timeEditor(i) : '') +
        '</div>');

      const next = list[idx + 1];
      if (!next) return;
      const h = hop(i, next);
      const gapMin = (parseHM(timeOf(next)) - parseHM(timeOf(i))) * 60;
      rows.push(gapRow(h, gapMin));
    });

    el.tlBody.innerHTML = rows.join('');
    renderTlFoot();
  }

  function gapRow(h, gapMin) {
    let txt, cls = '';
    if (!h) {
      txt = fmtGap(gapMin) + ' later';
    } else {
      const spare = gapMin - h.mins;
      const how = h.exact ? '' : '≈';
      const lead = how + fmtGap(h.mins) + ' <span class="gap__mode">' +
                   esc((MODES[h.mode] || MODES.other).label.toLowerCase()) + '</span>';
      if (spare < 0) { cls = ' gap--over'; txt = lead + ' — ' + fmtGap(spare) + ' short'; }
      else if (spare < 15) { cls = ' gap--tight'; txt = lead + ' — only ' + fmtGap(spare) + ' spare'; }
      else { txt = lead + ' — ' + fmtGap(spare) + ' there'; }
    }
    return '<div class="gap' + cls + '"><span></span>' +
           '<span class="gap__line"></span><span class="gap__txt">' + txt + '</span></div>';
  }

  function timeEditor(i) {
    return '<div class="tedit">' +
      '<button data-nudge="' + esc(i.id) + '|-30">&minus;30</button>' +
      '<button data-nudge="' + esc(i.id) + '|-10">&minus;10</button>' +
      '<input type="time" value="' + esc(timeOf(i) || '') + '" data-tset="' + esc(i.id) + '">' +
      '<button data-nudge="' + esc(i.id) + '|10">+10</button>' +
      '<button data-nudge="' + esc(i.id) + '|30">+30</button>' +
      (isMoved(i) ? '<button class="tedit__reset" data-treset="' + esc(i.id) +
        '" title="Back to the time in Notion">reset</button>' : '') +
      '</div>';
  }

  function pathIsPending(p) { return !p.notionId || !!p.pendingEdit; }

  function pendingCount() {
    const t = Object.keys(timeOverrides).length;
    const p = draftPaths.filter(pathIsPending).length;
    return { times: t, paths: p, total: t + p };
  }

  function renderTlFoot() {
    const n = pendingCount();
    const parts = [];

    if (n.total) {
      const bits = [];
      if (n.times) bits.push(n.times + ' time' + (n.times === 1 ? '' : 's'));
      if (n.paths) bits.push(n.paths + ' path' + (n.paths === 1 ? '' : 's'));
      parts.push('<button class="btn btn--on" id="btnSave"' + (saving ? ' disabled' : '') + '>' +
                 (saving ? 'Saving…' : 'Save ' + bits.join(' + ') + ' to Notion') + '</button>');
      parts.push('<button class="btn btn--ghost" id="btnCopyTimes">Copy instead</button>');
      parts.push('<button class="btn btn--ghost" id="btnClearTimes">Discard</button>');
    } else {
      parts.push('<span class="tl__sub">Click a time to move it. ' +
                 (editSecret ? 'Saving to Notion is set up.' : 'Changes stay in this browser until you save.') +
                 '</span>');
    }
    parts.push('<button class="btn btn--ghost" id="btnSecret" title="Passphrase for saving to Notion">' +
               (editSecret ? 'Passphrase set' : 'Set passphrase') + '</button>');
    el.tlFoot.innerHTML = parts.join('');
  }

  /* ──────────────────────────────────────────────────────────────────────
     SAVING TO NOTION
     The read function is public; this one needs the passphrase, because the
     site is on a public URL. The passphrase is kept in this browser and sent
     with each save — it is a gate against a stranger finding the URL, not a
     secret safe from anyone using this machine.
     ────────────────────────────────────────────────────────────────────── */

  function promptSecret() {
    const v = window.prompt(
      'Passphrase for saving to Notion.\n\n' +
      'This is the EDIT_SECRET set on the Netlify deploy. It is stored in this ' +
      'browser so you only type it once.', editSecret || '');
    if (v === null) return;
    editSecret = v.trim();
    lsSet(LS_SECRET, editSecret);
    renderTlFoot();
    toast(editSecret ? 'Passphrase saved in this browser.' : 'Passphrase cleared.');
  }

  async function saveToNotion() {
    if (saving) return;
    const n = pendingCount();
    if (!n.total) return;
    if (!editSecret) { promptSecret(); if (!editSecret) return; }

    saving = true;
    renderTlFoot();

    const times = Object.keys(timeOverrides).map(function (id) {
      const i = model.byId[id];
      if (!i) return null;
      return { id: id, time: timeOverrides[id], date: i.dates[0], kind: i.kind };
    }).filter(Boolean);

    const paths = draftPaths.filter(pathIsPending).map(function (p) {
      const pts = simplifyForStorage(p.points);
      return {
        id: p.id, notionId: p.notionId || null,
        name: p.name, date: p.date, time: p.time || null,
        fromName: p.fromName || null, toName: p.toName || null,
        miles: pts.length > 1 ? parseFloat(routeMiles(pts)) : null,
        route: pts.map(function (q) { return q[0].toFixed(5) + ',' + q[1].toFixed(5); }).join('; ')
      };
    });

    let res, json;
    try {
      res = await fetch(SAVE_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: editSecret, times: times, paths: paths })
      });
      json = await res.json();
    } catch (e) {
      saving = false; renderTlFoot();
      toast('Could not reach the save endpoint. Is save-trip-data deployed?');
      return;
    }

    saving = false;

    if (res.status === 401) {
      editSecret = '';
      lsSet(LS_SECRET, '');
      renderTlFoot();
      toast('Wrong passphrase — cleared it, set it again.');
      return;
    }
    if (!json || (!json.applied && !json.failed)) {
      renderTlFoot();
      toast((json && json.error) || 'Save failed with an unexpected response.');
      return;
    }

    // Apply only what actually landed. A partial failure must leave the
    // unsaved half pending rather than silently dropping it.
    (json.applied || []).forEach(function (a) {
      if (a.type === 'time') {
        const item = model.byId[a.id];
        if (item && timeOverrides[a.id]) {
          item.time = timeOverrides[a.id];   // Notion now agrees; stop flagging it
          delete timeOverrides[a.id];
        }
      } else if (a.type === 'path') {
        const p = draftPaths.find(function (x) { return x.id === a.id; });
        if (p) {
          p.notionId = a.notionId;
          p.pendingEdit = false;
          p.points = simplifyForStorage(p.points);
          p.anchors = p.anchors && p.anchors.length <= p.points.length ? p.anchors : p.points.slice();
        }
      }
    });
    lsSet(LS_TIMES, timeOverrides);
    savePaths();
    refreshAll();

    const failed = json.failed || [];
    if (!failed.length) {
      toast('Saved to Notion.');
    } else {
      const first = failed[0];
      toast(failed.length + ' of ' + (failed.length + (json.applied || []).length) +
            ' failed: ' + (first.error || 'unknown').slice(0, 90));
    }
  }

  function copyTimeChanges() {
    const lines = Object.keys(timeOverrides).map(function (id) {
      const i = model.byId[id];
      if (!i) return null;
      return (i.dates[0] || '') + '  ' + (i.time || '—') + ' → ' + timeOverrides[id] + '  ' + i.title;
    }).filter(Boolean).sort();
    if (!lines.length) return;
    copyText(lines.join('\n'), lines.length + ' change(s) copied — paste into Notion');
  }

  /* ── DETAIL PANEL ──────────────────────────────────────────────────────── */

  function select(id) {
    if (drawing) return;            // clicks belong to the draw tool
    activeId = id;
    stackIds = null;
    editingTimeFor = null;
    renderDetail();
    renderMap(false);
    renderTimeline();
    const i = model.byId[id];
    if (i && view === 'map' && map) {
      if (i.geo === 'point' && i.lat != null) map.panTo([i.lat, i.lng]);
    }
  }

  // A cluster whose members share one coordinate: list them so the click still
  // leads somewhere.
  function showStack(items) {
    stackIds = items.map(function (i) { return i.id; });
    activeId = null;

    const rows = sortByTime(items).map(function (i) {
      return '<li><button class="item" data-id="' + esc(i.id) + '">' +
          '<span class="item__time">' + esc(i.time && !i.timeIsDefault ? i.time : '') + '</span>' +
          '<span class="item__mark' + (i.booked === false ? ' is-unbooked' : '') +
            '" style="--c:' + itemColor(i) + '"></span>' +
          '<span><span class="item__title">' + esc(i.title) + '</span>' +
            '<br><span class="item__sub">' + esc(TYPE_LABEL[typeOf(i)]) + '</span>' +
          '</span></button></li>';
    }).join('');

    el.detailBody.innerHTML =
      '<div class="detail__kind">' + items.length + ' AT THIS SPOT</div>' +
      '<h2 class="detail__title">Stacked here</h2>' +
      '<p style="margin:0 0 10px;font-size:13px;color:var(--muted)">' +
        'These share the same coordinates, so zooming will not separate them. ' +
        'Pick one for its details.</p>' +
      '<ul class="items" style="padding:0">' + rows + '</ul>';

    el.detail.classList.add('is-open');
    renderMap(false);
  }

  function renderDetail() {
    const i = model.byId[activeId];
    if (!i) { el.detail.classList.remove('is-open'); return; }

    const rows = i.fields.filter(function (f) { return f[1] != null && f[1] !== ''; })
      .map(function (f) { return '<dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd>'; }).join('');

    const when = i.dates.filter(Boolean).map(fmtDate).join(' → ');
    const chip = i.booked === false
      ? '<span class="chip chip--unbooked">Not booked</span>'
      : (i.booked === true ? '<span class="chip chip--booked">Booked</span>' : '');

    el.detailBody.innerHTML =
      '<div class="detail__kind">' + esc(KIND_LABEL[i.kind] || i.kind) + '</div>' +
      '<h2 class="detail__title">' + esc(i.title) + '</h2>' +
      '<p style="margin:0 0 10px;font-size:13px;color:var(--muted)">' +
        '<span class="swatch" style="background:' + itemColor(i) + '"></span>' + esc(when) +
        (i.time ? ' · ' + esc(i.time) : '') + '</p>' +
      (chip ? '<p style="margin:0 0 12px">' + chip + '</p>' : '') +
      (rows ? '<dl class="detail__meta">' + rows + '</dl>' : '') +
      (i.link ? '<p style="margin:0 0 12px"><a href="' + esc(i.link) + '" target="_blank" rel="noopener">Open link</a></p>' : '') +
      (i.notes ? '<div class="detail__notes">' + esc(i.notes) + '</div>' : '');

    el.detail.classList.add('is-open');
  }

  /* ──────────────────────────────────────────────────────────────────────
     PATH TOOL
     Click points on the map to build a line. Auto mode asks a routing service
     to follow real streets between the last point and the new one; manual mode
     joins them directly. A finished path can be reopened and its vertices
     dragged. Paths live in this browser and copy out as a Route string for the
     Notion Places column, which is the same format the app already reads.
     ────────────────────────────────────────────────────────────────────── */

  function newId() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function startDraw() {
    if (drawing) return;
    editingPathId = null;
    drawing = { id: newId(), points: [], anchors: [], pending: 0 };
    el.stage.classList.add('drawing');
    updateDrawBar();
    renderPaths();
  }

  function cancelDraw() {
    drawing = null;
    el.stage.classList.remove('drawing');
    renderPaths();
  }

  function updateDrawBar() {
    if (!drawing) return;
    const n = drawing.anchors.length;
    el.drawCount.textContent = n + (n === 1 ? ' point' : ' points') +
      (drawing.pending ? ' · routing…' : '');
    el.drawHint.textContent = n === 0
      ? 'Click the map to start. Click an existing node to snap to it.'
      : 'Click to add. Click a node to finish there, or End path.';
    el.btnUndoPt.disabled = n === 0;
    el.btnEndPath.disabled = n < 2;
  }

  // Appends a point. In auto mode the segment from the previous anchor is
  // replaced by the routed geometry; if routing fails the straight segment
  // stands, so the tool never blocks on the network.
  async function addDrawPoint(lat, lng, finish) {
    if (!drawing) return;
    const prev = drawing.anchors[drawing.anchors.length - 1];
    drawing.anchors.push([lat, lng]);

    if (!prev) {
      drawing.points = [[lat, lng]];
    } else if (autoRoute) {
      drawing.points.push([lat, lng]);          // provisional straight segment
      drawing.pending++;
      updateDrawBar();
      renderPaths();
      const seg = await routeSegment(prev, [lat, lng]);
      drawing.pending--;
      if (drawing && seg && seg.length > 1) {
        // Replace just the straight segment we added, leaving earlier ones alone.
        drawing.points.pop();
        seg.slice(1).forEach(function (pt) { drawing.points.push(pt); });
      }
    } else {
      drawing.points.push([lat, lng]);
    }

    updateDrawBar();
    renderPaths();
    if (finish && drawing.anchors.length >= 2) endDraw();
  }

  function undoPoint() {
    if (!drawing || !drawing.anchors.length) return;
    drawing.anchors.pop();
    // Rebuilding beats trying to unpick routed geometry point by point.
    const anchors = drawing.anchors.slice();
    drawing.points = anchors.slice();
    updateDrawBar();
    renderPaths();
    if (autoRoute && anchors.length > 1) rebuildRouted(anchors);
  }

  async function rebuildRouted(anchors) {
    const out = [anchors[0]];
    for (let i = 1; i < anchors.length; i++) {
      const seg = await routeSegment(anchors[i - 1], anchors[i]);
      if (seg && seg.length > 1) seg.slice(1).forEach(function (p) { out.push(p); });
      else out.push(anchors[i]);
    }
    if (drawing) { drawing.points = out; renderPaths(); }
    else if (editingPathId) {
      const p = draftPaths.find(function (x) { return x.id === editingPathId; });
      if (p) { p.points = out; savePaths(); renderPaths(); }
    }
  }

  // What is this path between? Looks for a known node near each end so the
  // saved Transport row reads "Walk: Hoi An Airbnb → Japanese Covered Bridge"
  // rather than a pair of coordinates.
  function nearestName(pt, maxMeters) {
    let best = null, bestD = Infinity;
    model.items.forEach(function (i) {
      const q = i.geo === 'leg' ? null : (i.lat != null ? [i.lat, i.lng] : null);
      if (!q) return;
      const d = gcMilesExact(pt, q) * 1609.34;
      if (d < bestD) { bestD = d; best = i; }
    });
    return (best && bestD <= (maxMeters || 220)) ? best.title : null;
  }

  function endDraw() {
    if (!drawing || drawing.anchors.length < 2) return;
    const day = selectedDate === 'all' ? (model.days[0] && model.days[0].date) : selectedDate;
    const pts = drawing.points;
    const fromName = nearestName(pts[0]);
    const toName = nearestName(pts[pts.length - 1]);
